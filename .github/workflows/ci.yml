name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  incidents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/incidents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/catalog/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  notifications:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/notifications/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  compose:
    runs-on: ubuntu-latest
    needs: [incidents, catalog, notifications]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait incidents
      - run: python3 scripts/seed.py
      - run: curl --fail --silent http://localhost:8080/incidents/1
      - if: failure()
        run: docker compose logs
      - run: docker compose down -v
